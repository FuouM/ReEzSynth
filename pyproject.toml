[project]
name = "reezsynth"
version = "0.1.0"
description = "EbSynth-style example-based image and video stylization on WebGPU, PyTorch, Taichi and CUDA"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
# Keep requirements.txt (ComfyUI installs) in sync with this list, minus torch/torchvision.
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # The default `wgpu` backend: prebuilt abi3 wheels from the GitHub Releases
    # (tool.uv.sources) for the platforms CI builds. Elsewhere build rust/ezsynth-wgpu.
    "ezsynth-wgpu==0.1.0; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

[project.scripts]
reezsynth-video = "ezsynth.cli.video:main"
reezsynth-prepare = "ezsynth.cli.prepare:main"
fastblend = "ezsynth.cli.fastblend:main"
fastblend-interpolate = "ezsynth.cli.fastblend_interpolate:main"

[project.optional-dependencies]
taichi = ["taichi>=1.7"]
# JIT build of the native `cuda` synthesis / FastBlend extensions (torch.utils.cpp_extension).
cuda = ["ninja>=1.11"]
# The lsmr / cg / amg Poisson solvers (the default lsqr runs on NumPy).
scipy = ["scipy>=1.11"]
cupy = ["cupy-cuda12x>=13; sys_platform != 'darwin'"]
pyamg = ["pyamg>=5.0", "scipy>=1.11"]
neuflow = ["huggingface-hub>=0.20"]
# PAGE / PST edge methods.
phycv = ["phycv>=1.2"]
# FaceBlit: face-alignment (FAN + BlazeFace/S3FD) detects landmarks; numba runs the CPU DFS path.
faceblit = [
    "face-alignment>=1.4",
    "numba>=0.59",
    "pillow>=10.0",
    "matplotlib>=3.7",
]
# Optional dlib landmark backend (sdist only: needs CMake and a C++ compiler).
dlib = ["dlib>=19.22"]
all = ["reezsynth[taichi,cuda,scipy,cupy,pyamg,neuflow,phycv,faceblit,dlib]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.17.4",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ezsynth", "FastBlend", "FaceBlit", "reezsynth_nodes"]
exclude = ["FaceBlit/examples", "FaceBlit/models", "**/tests"]

[tool.uv]
# Installed editable from the clone: model checkpoints (models/) and example media are
# resolved relative to the repository.
package = true
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
ezsynth-wgpu = [
    { url = "https://github.com/FuouM/ReEzSynth/releases/download/v0.1.0/ezsynth_wgpu-0.1.0-cp310-abi3-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/FuouM/ReEzSynth/releases/download/v0.1.0/ezsynth_wgpu-0.1.0-cp310-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl", marker = "sys_platform == 'linux'" },
    { url = "https://github.com/FuouM/ReEzSynth/releases/download/v0.1.0/ezsynth_wgpu-0.1.0-cp310-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# dlib ships only an sdist; declare its metadata so locking does not need a CMake build.
[[tool.uv.dependency-metadata]]
name = "dlib"
version = "19.24.6"
requires-dist = []

[tool.pytest.ini_options]
testpaths = ["ezsynth/tests", "FastBlend/tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
