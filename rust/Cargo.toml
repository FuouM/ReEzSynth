[workspace]
resolver = "3"
members = ["ebsynth-gpu", "ebsynth-web", "ezsynth-wgpu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ebsynth-gpu = { path = "ebsynth-gpu" }
wgpu = { version = "30.0.1", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
futures-channel = "0.3"
pollster = "1.0.1"

[profile.release]
lto = "thin"
codegen-units = 1
